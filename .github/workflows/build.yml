name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Composants Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk IPTV-TV.apk

      - name: Publier l'APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-TV-apk
          path: IPTV-TV.apk

      - name: Publier une Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: IPTV TV build ${{ github.run_number }}
          files: IPTV-TV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
